org: bluefinpaymentsystems
app: start
service: justproject

provider:
  name: aws
  runtime: nodejs20.x
  environment:
    DYNAMODB_CUSTOMER_TABLE: ${self:service}-customerTable-${sls:stage}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:4200
      allowedHeaders: null
      allowedMethods:
        - OPTIONS
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE

iam:
  role:
    statements:
      - Effect: 'Allow'
        Action:
          - 'dynamodb:PutItem'
          - 'dynamodb:Get*'
          - 'dynamodb:Scan*'
          - 'dynamodb:UpdateItem'
          - 'dynamodb:DeleteItem'
        Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-customerTable-${sls:stage}

functions:
  tokenHandler:
    handler: handler.tokenHandler
    events:
      - httpApi:
          method: POST
          path: /token/handle

  detokenizeHandler:
    handler: handler.detokenizeHandler
    events:
      - httpApi:
          method: POST
          path: /token/detokenize

  extended:
    handler: handler.extended
    events:
      - httpApi:
          method: POST
          path: /post/just/to/this/path

resources:
  Resources:
    CustomerTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: primary_key
            AttributeType: S
        BillingMode: PAY_PER_REQUEST
        KeySchema:
          - AttributeName: primary_key
            KeyType: HASH
        TableName: ${self:service}-customerTable-${sls:stage}
